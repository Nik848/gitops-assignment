
name: Secret Management Check

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-secret:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate secret availability
        env:
          DEMO_API_TOKEN: ${{ secrets.DEMO_API_TOKEN }}
        shell: bash
        run: |
          if [ -z "$DEMO_API_TOKEN" ]; then
            echo "ERROR: Required secret is not configured."
            exit 1
          fi

          echo "SUCCESS: Secret is configured."
          echo "Secret value was not printed."
