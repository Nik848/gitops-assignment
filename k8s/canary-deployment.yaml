
apiVersion: v1
kind: ConfigMap
metadata:
  name: canary-stable-page
data:
  index.html: |
    <html>
      <body>
        <h1>Stable Version</h1>
        <p>Currently serving the stable application.</p>
      </body>
    </html>
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: canary-new-page
data:
  index.html: |
    <html>
      <body>
        <h1>Canary Version</h1>
        <p>This is the new application version.</p>
      </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: canary-stable
  labels:
    app: canary-demo
    version: stable
spec:
  replicas: 3
  selector:
    matchLabels:
      app: canary-demo
      version: stable
  template:
    metadata:
      labels:
        app: canary-demo
        version: stable
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
      volumes:
        - name: html
          configMap:
            name: canary-stable-page
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: canary-new
  labels:
    app: canary-demo
    version: canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: canary-demo
      version: canary
  template:
    metadata:
      labels:
        app: canary-demo
        version: canary
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
      volumes:
        - name: html
          configMap:
            name: canary-new-page
---
apiVersion: v1
kind: Service
metadata:
  name: canary-service
spec:
  type: NodePort
  selector:
    app: canary-demo
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30081
